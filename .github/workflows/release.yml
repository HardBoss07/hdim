name: Release Builds

on:
  release:
    types: [published]

jobs:
  build-and-upload:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            bin_name: hdim
            asset_name: hdim-linux-x86_64.tar.gz
          - os: windows-latest
            bin_name: hdim.exe
            asset_name: hdim-windows-x86_64.zip

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Release Binary
        run: cargo build --release

      - name: Package Release (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir dist
          cp target/release/${{ matrix.bin_name }} dist/
          cp README.md LICENSE dist/
          tar -czvf ${{ matrix.asset_name }} -C dist .

      - name: Package Release (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target\release\${{ matrix.bin_name }}, README.md, LICENSE -Destination dist\
          Compress-Archive -Path dist\* -DestinationPath ${{ matrix.asset_name }}

      - name: Upload Assets to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}
